name: Build release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os == 'ubuntu-latest' && 'linux' ||
      matrix.os == 'macos-latest' && 'macos' || 'windows' }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # Default torch wheels bundle CUDA (nvidia-* + triton, ~2 GB unpacked) which
      # can push release assets past the 2 GB limit and bloats bundles. Replace
      # with the CPU build on Linux and Windows. A plain `pip install torch==2.14.0`
      # is NOT enough: pip sees the same version "already satisfied" and keeps the
      # CUDA wheel, so the CUDA torch is uninstalled first.
      - name: Install CPU-only torch (Linux / Windows)
        if: runner.os != 'macOS'
        run: |
          pip uninstall -y torch torchvision || true
          NV="$(pip list --format freeze | grep -iE '^(nvidia|triton)[-_.]' | cut -d= -f1)"
          if [ -n "$NV" ]; then pip uninstall -y $NV; fi
          pip install torch==2.14.0 torchvision==0.29.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Generate app icons
        run: python scripts/gen_icon.py

      - name: Make macOS .icns
        if: runner.os == 'macOS'
        run: iconutil -c icns icons/icon.iconset -o icons/icon.icns

      # Windows: a single-file double-clickable XiaomiOCR.exe
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: >
          pyinstaller run.py --name XiaomiOCR --onefile --windowed --icon icons\icon.ico
          --exclude-module onnxruntime --exclude-module pymupdf_layout --exclude-module pymupdf4llm
          --exclude-module torch.utils.tensorboard
          --collect-all odfpy --collect-all ebooklib --collect-all striprtf

      # macOS: a proper XiaomiOCR.app application bundle with an icon
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: >
          pyinstaller run.py --name XiaomiOCR --onedir --windowed --icon icons/icon.icns
          --exclude-module onnxruntime --exclude-module pymupdf_layout --exclude-module pymupdf4llm
          --exclude-module torch.utils.tensorboard
          --collect-all odfpy --collect-all ebooklib --collect-all striprtf

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: >
          pyinstaller run.py --name XiaomiOCR --onedir --windowed
          --exclude-module onnxruntime --exclude-module pymupdf_layout --exclude-module pymupdf4llm
          --exclude-module torch.utils.tensorboard
          --collect-all odfpy --collect-all ebooklib --collect-all striprtf

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/XiaomiOCR.exe -DestinationPath dist/XiaomiOCR-windows.zip -Force

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -q -r XiaomiOCR-macos.zip XiaomiOCR.app

      # Linux: a runnable AppImage bundle (single file, mounts on any modern distro)
      - name: Package (Linux -> AppImage)
        if: runner.os == 'Linux'
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r dist/XiaomiOCR AppDir/usr/bin/
          chmod +x AppDir/usr/bin/XiaomiOCR/XiaomiOCR
          cat > AppDir/AppRun <<'EOF'
          #!/bin/bash
          SELF="$(readlink -f "$0")"
          HERE="${SELF%/*}"
          exec "$HERE/usr/bin/XiaomiOCR/XiaomiOCR" "$@"
          EOF
          chmod a+rx AppDir/AppRun
          cp icons/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/xocr.png
          cp icons/icon.png AppDir/.DirIcon
          cp icons/icon.png AppDir/xocr.png
          cat > AppDir/xocr.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Xiaomi OCR
          Comment=Offline OCR powered by Xiaomi-OCR-0
          Exec=XiaomiOCR
          Icon=xocr
          Categories=Office;
          Terminal=false
          EOF
          curl -L -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run AppDir dist/XiaomiOCR-linux.AppImage

      - name: Attach bundles to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/XiaomiOCR-windows.zip
            dist/XiaomiOCR-macos.zip
            dist/XiaomiOCR-linux.AppImage

      - name: Upload artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: XiaomiOCR-${{ runner.os }}
          path: |
            dist/XiaomiOCR-windows.zip
            dist/XiaomiOCR-macos.zip
            dist/XiaomiOCR-linux.AppImage
