name: Build release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{
      matrix.os == 'ubuntu-latest' && 'linux' ||
      matrix.os == 'macos-latest' && 'macos' || 'windows' }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          pyinstaller run.py --name XiaomiOCR --windowed --onedir ^
            --collect-all pymupdf --collect-all odfpy --collect-all ebooklib --collect-all striprtf

      - name: Build (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          pyinstaller run.py --name XiaomiOCR --windowed --onedir \
            --collect-all pymupdf --collect-all odfpy --collect-all ebooklib --collect-all striprtf

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/XiaomiOCR -DestinationPath dist/XiaomiOCR-windows.zip -Force

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -q -r XiaomiOCR-macos.zip XiaomiOCR
          cd ..

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          zip -q -r XiaomiOCR-linux.zip XiaomiOCR
          cd ..

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/XiaomiOCR-windows.zip
            dist/XiaomiOCR-macos.zip
            dist/XiaomiOCR-linux.zip

      - name: Upload artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: XiaomiOCR-${{ runner.os }}
          path: dist/XiaomiOCR-*.zip
